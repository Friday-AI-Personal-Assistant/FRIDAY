[package]
name = "friday"
version = "0.1.0"
description = "FRIDAY personal AI desktop assistant"
authors = ["FRIDAY contributors"]
edition = "2021"

[lib]
name = "friday_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
chacha20poly1305 = "0.10"
rand = "0.8"
keyring = { version = "3", features = ["windows-native"] }

serde_json = "1"
