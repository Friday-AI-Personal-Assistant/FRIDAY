name: Free local Windows desktop
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [feat/free-local-agent]
concurrency:
  group: free-local-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Renderer approval integration tests
        run: node tests/ui-smoke.cjs
      - run: python -m pip install -r worker/requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Package local worker
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile
          --name friday-worker --distpath src-tauri/worker
          --collect-all faster_whisper --collect-all ctranslate2
          --collect-all onnxruntime --collect-all sounddevice
          --collect-all pywinauto --collect-all pyautogui
          --collect-all pyttsx3 --collect-all pypdf --collect-all docx --collect-all reportlab
          --hidden-import pyttsx3.drivers.sapi5 --hidden-import PIL.ImageGrab
          worker/friday_worker.py
      - name: Generate Windows application icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $size = 256
          $bitmap = [System.Drawing.Bitmap]::new($size, $size)
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $graphics.Clear([System.Drawing.Color]::FromArgb(20, 60, 48))
          $font = [System.Drawing.Font]::new("Segoe UI", 150, [System.Drawing.FontStyle]::Bold, [System.Drawing.GraphicsUnit]::Pixel)
          $brush = [System.Drawing.SolidBrush]::new([System.Drawing.Color]::White)
          $format = [System.Drawing.StringFormat]::new()
          $format.Alignment = [System.Drawing.StringAlignment]::Center
          $format.LineAlignment = [System.Drawing.StringAlignment]::Center
          $graphics.DrawString("F", $font, $brush, [System.Drawing.RectangleF]::new(0, 0, $size, $size), $format)
          $iconHandle = $bitmap.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle($iconHandle)
          New-Item -ItemType Directory -Force -Path "src-tauri/icons" | Out-Null
          $stream = [System.IO.File]::Open("src-tauri/icons/icon.ico", [System.IO.FileMode]::Create)
          $icon.Save($stream)
          $stream.Dispose()
          $icon.Dispose(); $graphics.Dispose(); $font.Dispose(); $brush.Dispose(); $format.Dispose(); $bitmap.Dispose()
          Add-Type -Namespace Native -Name IconCleanup -MemberDefinition '[System.Runtime.InteropServices.DllImport("user32.dll")] public static extern bool DestroyIcon(System.IntPtr handle);'
          [Native.IconCleanup]::DestroyIcon($iconHandle) | Out-Null

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Build NSIS and MSI installers
        run: npm run tauri -- build
      - name: Install, launch and uninstall NSIS smoke test
        shell: pwsh
        run: ./scripts/test-install.ps1
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: friday-free-local-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
